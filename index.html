<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For ma boy💕</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="sky"></div>

    <div class="moon"></div>

    <div id="stars"></div>

    <div id="hearts"></div>

    <!-- گربه سمت چپ -->

    <div class="walking-cat cat-left">

        <div class="cat-body">

            <div class="cat-head">

                <span class="ear left-ear"></span>
                <span class="ear right-ear"></span>

                <span class="eye left-eye"></span>
                <span class="eye right-eye"></span>

                <span class="nose"></span>

            </div>

            <div class="body"></div>

            <div class="leg leg1"></div>
            <div class="leg leg2"></div>
            <div class="leg leg3"></div>
            <div class="leg leg4"></div>

            <div class="tail"></div>

        </div>

    </div>

    <!-- گربه سمت راست -->

    <div class="walking-cat cat-right">

        <div class="cat-body">

            <div class="cat-head">

                <span class="ear left-ear"></span>
                <span class="ear right-ear"></span>

                <span class="eye left-eye"></span>
                <span class="eye right-eye"></span>

                <span class="nose"></span>

            </div>

            <div class="body"></div>

            <div class="leg leg1"></div>
            <div class="leg leg2"></div>
            <div class="leg leg3"></div>
            <div class="leg leg4"></div>

            <div class="tail"></div>

        </div>

    </div>

    <!-- متن اصلی -->

    <div class="container">

        <h1>
            فاصله مانع علاقه بی‌حد و مرز من به تو نیست
        </h1>

        <button id="startBtn">
            For ma boy💕
        </button>

        <div id="letter" class="hidden">

            <p id="typing"></p>

            <div id="end">
                💗 《 تا همیشه مال تو، ثنا 》
            </div>

        </div>

    </div>

    <!-- آهنگ -->

    <audio id="music">

        <source src="daylight.mp3" type="audio/mpeg">

    </audio>

    <script src="script.js"></script>

</body>

</html>
